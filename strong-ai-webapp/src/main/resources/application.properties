spring.datasource.username = root
spring.datasource.driverClassName = com.mysql.cj.jdbc.Driver
spring.datasource.password = root
spring.datasource.hikari.maxLifetime = 90000
spring.datasource.url = jdbc:mysql://127.0.0.1:3306/strong_ai?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior\
  =convertToNull&useLocalSessionState=true&tinyInt1isBit=false&serverTimezone=Asia/Shanghai

# strong_ai is a shared, non-empty schema. Record its pre-document-governance
# state as version 0 so V1 can still create this module's tables.
spring.flyway.baseline-on-migrate = true
spring.flyway.baseline-version = 1

strong.document-governance.test-login.enabled = false
