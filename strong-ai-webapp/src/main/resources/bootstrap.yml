server:
  port: 11028
spring:
  application:
    name: strong-ai
  cloud:
    loadbalancer:
      ribbon:
        enabled: false #禁用ribbon
      retry:
        enabled: false #禁用重试
    inetutils:
      preferredNetworks: [ '192.168' ]
    nacos:
      config:
        server-addr: 192.168.40.56:8848 #nacos注册中心地址
        namespace: test20-2 #对应的namespaceId
        group: ${spring.application.name} #分组ID，这里使用spring.application.name的值
        file-extension: properties
        refresh-enabled: true
        shared-configs:
          - data-id: config.properties # 通用配置
            group: ${spring.cloud.nacos.config.group}
            refresh: true
          - data-id: cache.properties # 缓存配置
            group: ${spring.cloud.nacos.config.group}
            refresh: false
          - data-id: mq.properties # MQ配置
            group: ${spring.cloud.nacos.config.group}
            refresh: false
          - data-id: db.properties # 数据库配置
            group: ${spring.cloud.nacos.config.group}
            refresh: false
          - data-id: log4j2-spring.xml # log4j2配置
            group: ${spring.cloud.nacos.config.group}
            refresh: true
      discovery:
        server-addr: ${spring.cloud.nacos.config.server-addr}
        namespace: ${spring.cloud.nacos.config.namespace}
        service: ${spring.application.name}
logging:
  config: classpath:log4j2-spring.xml

management:
  endpoints:
    web:
      exposure:
        include:
          - "serviceregistry"
          - "prometheus"
          - "health"
        exclude:
          - "solr"
          - "elasticsearch"
  metrics:
    tags:
      application: ${spring.application.name}

strong:
  swagger:
    base-package: cn.strong.webapp.user

# ai4j-spring-boot-starter: provider 使用 id 路由，platform 选择对应 SDK 实现。
# API Key 仅从环境变量或 Nacos 密文配置获取，禁止提交到仓库。
ai:
  platforms:
    - id: openai
      platform: openai
#      api-key: ${OPENAI_API_KEY:REMOVED_SECRET}
#      api-host: ${OPENAI_API_HOST:https://ai.962831.xyz}
      api-host: ${OPENAI_API_HOST:https://1412520.cyou}
      api-key: ${OPENAI_API_KEY:REMOVED_SECRET}
      chat-completion-url: ${OPENAI_CHAT_COMPLETION_URL:/v1/chat/completions}
      responses-url: ${OPENAI_RESPONSES_URL:/v1/responses}
    - id: doubao
      platform: doubao
      api-key: ${DOUBAO_API_KEY:}
      api-host: ${DOUBAO_API_HOST:https://ark.cn-beijing.volces.com/api/v3}
      chat-completion-url: ${DOUBAO_CHAT_COMPLETION_URL:/chat/completions}
    - id: qwen
      platform: dashscope
      api-key: ${QWEN_API_KEY:}
      api-host: ${QWEN_API_HOST:https://dashscope.aliyuncs.com/api/v1}
      responses-url: ${QWEN_RESPONSES_URL:/services/aigc/text-generation/generation}
    - id: deepseek
      platform: deepseek
      api-key: ${DEEPSEEK_API_KEY:REMOVED_SECRET}
      api-host: ${DEEPSEEK_API_HOST:https://1412520.cyou}
      chat-completion-url: ${DEEPSEEK_CHAT_COMPLETION_URL:/v1/chat/completions}

codex:
  gateway:
    inbound-api-key: ${CODEX_GATEWAY_API_KEY:REMOVED_SECRET}

feign:
  httpclient: # 开启 HttpClient
    enabled: true
    max-connections: 200 # 最大连接数
    max-connections-per-route: 50 #每个路由最大连接数
    connection-timeout: 5000 #连接超时
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic
