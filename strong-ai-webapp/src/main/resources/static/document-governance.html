<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f6f5f1">
    <title>技术文档治理台 · Strong AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/document-governance.css">
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <script src="/document-governance.js" defer></script>
</head>
<body>
<div class="governance-shell">
    <header class="governance-topbar">
        <a class="governance-brand" href="/" aria-label="返回 Strong AI 聊天"><span class="brand-mark">S</span><span>Strong AI <em>/</em> 技术文档治理台</span></a>
        <div class="top-actions"><span class="team-indicator" id="teamIndicator">TEAM</span><button class="test-identity-button" id="testIdentityButton" type="button" hidden title="切换测试身份"><i data-lucide="shield-user"></i><span id="testIdentityLabel">测试身份</span></button><button class="icon-button" id="themeButton" type="button" aria-label="切换深色模式" title="切换主题"><i data-lucide="moon"></i></button></div>
    </header>
    <nav class="mobile-tabs" aria-label="工作区视图">
        <button type="button" data-pane="documents" class="active"><i data-lucide="files"></i>文档</button>
        <button type="button" data-pane="editor"><i data-lucide="file-pen-line"></i>编辑</button>
        <button type="button" data-pane="inspect"><i data-lucide="scan-search"></i>检查</button>
    </nav>
    <main class="governance-workspace" id="governanceWorkspace">
        <aside class="document-pane pane-documents" data-pane-content="documents">
            <div class="pane-heading"><div><p class="eyebrow">DOCUMENTS</p><h1>文档列表</h1></div><button class="icon-button accent-icon" id="newDocumentButton" type="button" aria-label="新建文档" title="新建文档"><i data-lucide="file-plus-2"></i></button></div>
            <label class="search-field"><i data-lucide="search"></i><input id="documentSearch" type="search" placeholder="搜索标题或标签" autocomplete="off"></label>
            <select class="status-filter" id="statusFilter" aria-label="按状态筛选"><option value="">全部状态</option><option value="DRAFT">草稿</option><option value="PUBLISHED">已发布</option><option value="ARCHIVED">已归档</option></select>
            <div class="document-list" id="documentList" aria-live="polite"></div>
        </aside>
        <section class="editor-pane pane-editor" data-pane-content="editor">
            <div class="pane-heading editor-heading"><div><p class="eyebrow" id="documentMeta">DRAFT</p><input id="documentTitle" class="title-input" aria-label="文档标题" placeholder="未选择文档" disabled></div><div class="editor-actions"><button class="icon-button" id="saveDraftButton" type="button" aria-label="保存草稿" title="保存草稿" disabled><i data-lucide="save"></i></button><label class="model-select" aria-label="AI 优化策略"><span>策略</span><select id="aiStrategySelect"><option value="">系统默认</option></select></label><label class="model-select" aria-label="AI 优化模型"><span>模型</span><select id="aiModelSelect"><option value="gpt-5.6-luna" data-provider="openai">OpenAI / GPT-5.6 Luna</option></select></label><button class="command-button" id="optimizeButton" type="button" disabled><i data-lucide="sparkles"></i><span>AI 优化</span></button><button class="command-button" id="qualityButton" type="button" disabled><i data-lucide="scan-line"></i><span>质量检查</span></button><button class="command-button" id="archiveButton" type="button" title="归档 / 恢复" disabled><i data-lucide="archive"></i><span id="archiveLabel">归档</span></button><button class="command-button publish-button" id="publishButton" type="button" disabled><i data-lucide="send"></i><span>发布</span></button></div></div>
            <div class="editor-fields"><input id="documentType" aria-label="文档类型" placeholder="文档类型" disabled><input id="documentTags" aria-label="标签" placeholder="标签，用逗号分隔" disabled></div>
            <textarea id="documentContent" class="document-editor" spellcheck="false" placeholder="# 从一份技术文档开始" disabled></textarea>
            <div class="editor-footer"><span id="editorState">选择或新建文档</span><span id="lineCounter">1 行</span></div>
        </section>
        <aside class="inspect-pane pane-inspect" data-pane-content="inspect">
            <div class="inspection-tabs" role="tablist"><button type="button" data-inspection="issues" class="active" role="tab">质量检查</button><button type="button" data-inspection="versions" role="tab">版本历史</button><button type="button" data-inspection="terms" role="tab">术语库</button></div>
            <section class="inspection-view" id="issuesView"><div class="inspection-head"><div><p class="eyebrow">QUALITY</p><h2 id="qualityScore">等待检查</h2></div><span class="issue-count" id="issueCount">0</span></div><div class="issue-list" id="issueList"></div></section>
            <section class="inspection-view" id="versionsView" hidden><div class="inspection-head"><div><p class="eyebrow">VERSIONS</p><h2>版本历史</h2></div><button class="icon-button" id="loadVersionsButton" type="button" aria-label="刷新版本历史" title="刷新版本"><i data-lucide="refresh-cw"></i></button></div><div class="version-toolbar" id="versionToolbar"><span id="compareHint">选择 1~2 个版本比较</span><div class="version-toolbar-actions"><button class="text-command" id="compareDraftButton" type="button" disabled><i data-lucide="git-compare"></i>对比草稿</button><button class="text-command" id="rollbackButton" type="button" disabled><i data-lucide="history"></i>回滚到此版本</button></div></div><div class="version-list" id="versionList"></div><div class="diff-content" id="diffContent"></div></section>
            <section class="inspection-view" id="termsView" hidden><div class="inspection-head"><div><p class="eyebrow">TERMINOLOGY</p><h2>术语库</h2></div><button class="icon-button admin-control" id="addTermButton" type="button" aria-label="添加术语" title="添加术语" hidden><i data-lucide="plus"></i></button></div><div class="term-list" id="termList"></div><div class="admin-panel" id="adminPanel" hidden><button type="button" class="text-command" id="manageTemplatesButton"><i data-lucide="layout-template"></i>模板管理</button><button type="button" class="text-command" id="manageRuleSetsButton"><i data-lucide="sliders-horizontal"></i>规则管理</button><button type="button" class="text-command" id="manageStrategiesButton"><i data-lucide="wand-sparkles"></i>AI 优化策略</button></div></section>
        </aside>
    </main>
</div>
<dialog class="term-dialog" id="termDialog"><form method="dialog" id="termForm"><header><strong>新增术语</strong><button class="icon-button" value="cancel" aria-label="关闭" title="关闭"><i data-lucide="x"></i></button></header><label>术语<input id="termName" required maxlength="200"></label><label>推荐写法<input id="preferredTerm" maxlength="200"></label><label class="check-field"><input id="forbiddenTerm" type="checkbox">禁用术语</label><label>说明<input id="termDescription" maxlength="500"></label><footer><button class="command-button" value="cancel" type="button" id="cancelTermButton">取消</button><button class="command-button publish-button" value="default" type="submit">保存</button></footer></form></dialog>
<dialog class="term-dialog" id="templateDialog"><form id="templateForm"><header><div><p class="eyebrow">TEMPLATE</p><strong>模板管理</strong></div><button class="icon-button" type="button" id="cancelTemplateButton" aria-label="关闭" title="关闭"><i data-lucide="x"></i></button></header><div class="dialog-list" id="templateList" aria-live="polite"></div><label>模板名称<input id="templateName" required maxlength="100"></label><label>适用文档类型<input id="templateDocType" required maxlength="64" placeholder="如 README、技术方案"></label><label>必填章节（每行一个）<textarea id="templateHeadings" rows="5" placeholder="概述&#10;安装&#10;使用说明"></textarea></label><footer><button class="command-button" type="button" id="resetTemplateButton">清空表单</button><button class="command-button publish-button" type="submit">保存模板</button></footer></form></dialog>
<dialog class="term-dialog" id="ruleSetDialog"><form id="ruleSetForm"><header><div><p class="eyebrow">RULE SET</p><strong>规则管理</strong></div><button class="icon-button" type="button" id="cancelRuleSetButton" aria-label="关闭" title="关闭"><i data-lucide="x"></i></button></header><div class="dialog-list" id="ruleSetList" aria-live="polite"></div><label>规则集名称<input id="ruleSetName" required maxlength="100"></label><label class="check-field"><input id="ruleSetEnabled" type="checkbox" checked>启用</label><label>规则配置 JSON<textarea id="ruleSetConfig" rows="10" spellcheck="false"></textarea></label><footer><button class="command-button" type="button" id="resetRuleSetButton">载入默认</button><button class="command-button publish-button" type="submit">保存规则集</button></footer></form></dialog>
<dialog class="term-dialog strategy-dialog" id="aiStrategyDialog"><form id="aiStrategyForm"><header><div><p class="eyebrow">AI STRATEGY</p><strong>AI 优化策略</strong></div><button class="icon-button" type="button" id="cancelStrategyButton" aria-label="关闭" title="关闭"><i data-lucide="x"></i></button></header>
    <div class="dialog-list" id="strategyList" aria-live="polite"></div>
    <div class="strategy-editor-meta" id="strategyEditorMeta"></div>
    <label>策略名称<input id="strategyName" required maxlength="100"></label>
    <label>策略说明<input id="strategyDescription" maxlength="500"></label>
    <fieldset class="strategy-group"><legend>优化方向</legend><div id="strategyDirections" class="strategy-directions"></div></fieldset>
    <fieldset class="strategy-group"><legend>保护项</legend><div class="strategy-checks">
        <label class="check-field"><input type="checkbox" id="protCodeBlocks" checked>代码块</label>
        <label class="check-field"><input type="checkbox" id="protLinks" checked>链接</label>
        <label class="check-field"><input type="checkbox" id="protCommands" checked>命令</label>
        <label class="check-field"><input type="checkbox" id="protVariables" checked>变量名</label>
        <label class="check-field"><input type="checkbox" id="protApiFields" checked>接口字段</label>
        <label class="check-field"><input type="checkbox" id="protProperNouns" checked>专有名词</label>
    </div></fieldset>
    <fieldset class="strategy-group"><legend>输出约束</legend><div class="strategy-checks">
        <label class="check-field"><input type="checkbox" id="allowNewFacts">允许补充事实</label>
        <label class="check-field"><input type="checkbox" id="allowSectionReorder">允许章节重排</label>
        <label class="check-field"><input type="checkbox" id="allowExamples">允许补充示例</label>
    </div>
    <label>语气<input id="strategyTone" maxlength="100" placeholder="专业、简洁"></label>
    <label>优化模式<select id="strategyMode"><option value="format">仅格式</option><option value="polish">润色</option><option value="restructure">重组</option></select></label></fieldset>
    <label>团队补充要求<textarea id="strategyCustomInstruction" rows="3" maxlength="2000" spellcheck="false"></textarea></label>
    <fieldset class="strategy-group"><legend>模型参数</legend>
        <label>厂商<input id="strategyProvider" maxlength="64" placeholder="openai"></label>
        <label>模型<input id="strategyModelName" maxlength="64" placeholder="gpt-5.6-sol"></label>
        <label class="check-field"><input type="checkbox" id="strategyDeepThinking">深度思考</label>
        <label>最大 Token<input id="strategyMaxTokens" type="number" min="1" value="8192"></label>
    </fieldset>
    <footer><button class="command-button" type="button" id="newStrategyButton">新建</button><button class="command-button" type="button" id="publishStrategyButton">发布</button><button class="command-button" type="button" id="defaultStrategyButton">设为默认</button><button class="command-button" type="button" id="disableStrategyButton">停用</button><button class="command-button publish-button" type="submit">保存草稿</button></footer>
</form></dialog>
<dialog class="term-dialog" id="testIdentityDialog"><form id="testIdentityForm"><header><div><p class="eyebrow">TEST LOGIN</p><strong>模拟身份</strong></div><button class="icon-button" type="button" id="cancelTestIdentityButton" aria-label="关闭" title="关闭"><i data-lucide="x"></i></button></header><label>用户 ID<input id="testUserId" required maxlength="100" autocomplete="off"></label><label>团队 ID<input id="testTeamId" required maxlength="100" autocomplete="off"></label><label>角色<select id="testRole" aria-label="测试角色"><option value="member">成员</option><option value="admin">管理员</option></select></label><footer><button class="command-button" type="button" id="clearTestIdentityButton">恢复默认</button><button class="command-button publish-button" type="submit">应用身份</button></footer></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
